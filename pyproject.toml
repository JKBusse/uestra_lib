[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uestra-abfahrten"
version = "0.1.0"
description = "Echtzeit-Abfahrten und Verbindungen der Üstra/GVH (HAFAS), nur Standardbibliothek"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
uestra = "uestra_abfahrten:main"

[tool.setuptools]
py-modules = ["uestra_abfahrten"]
